<h1 id="%E4%B8%80%E9%97%AE%E9%A2%98%E6%8F%90%E5%87%BA%E6%95%B0%E5%AD%97%E5%8C%96%E8%BD%AC%E5%9E%8B%E7%9A%84%E7%8E%B0%E5%AE%9E%E5%9B%B0%E5%A2%83">一、问题提出：数字化转型的现实困境</h1>
<p><strong>转型阵痛期在延展</strong></p>
<p>埃森哲指数显示，2018—2022 年企业数字化转型水平得分<strong>五年来首次下降</strong></p>
<p><strong>传统金融存在结构性错位</strong></p>
<ul>
<li>银行风控偏审慎，强化抵押品要求，形成嫌贫爱富的授信模式</li>
<li>资本市场覆盖面与供给规模有边界，压制成千上万主体的转型活力</li>
</ul>
<blockquote>
<p>Hicks：工业革命不得不等候金融革命</p>
</blockquote>

<h1 id="%E4%BA%8C%E7%90%86%E8%AE%BA%E9%80%BB%E8%BE%91%E4%B8%89%E5%A4%A7%E5%9B%B0%E5%B1%80%E5%A6%82%E4%BD%95%E7%A0%B4%E8%A7%A3">二、理论逻辑：三大困局如何破解</h1>
<table>
<thead>
<tr>
<th>困局</th>
<th>成因</th>
<th>金融科技的破解逻辑</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>不会转型</strong></td>
<td>转型能力欠缺，难以判断技术嵌合度</td>

<td><strong>不敢转型</strong></td>

</tr>
</tbody>
</table>

<tr>

<header>金融科技与企业数字化转型</header>
<h1 id="%E5%85%AC%E5%BC%8F%E6%8E%A8%E5%AF%BC%E4%BA%8C%E6%BA%A2%E5%87%BA%E5%8D%8F%E5%90%8C%E4%B8%8E%E8%BE%B9%E9%99%85%E6%95%88%E5%BA%94">公式推导二：溢出协同与边际效应</h1>

<header>金融科技与企业数字化转型</header>
<h1 id="%E4%BB%A3%E7%A0%81%E7%A4%BA%E4%BE%8B%E4%B8%80%E7%94%A8-python-%E6%9E%84%E5%BB%BA-dcg-%E6%8C%87%E6%A0%87">代码示例一：用 Python 构建 DCG 指标</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> jieba, numpy <span class="hljs-keyword">as</span> np, pandas <span class="hljs-keyword">as</span> pd

<span class="hljs-comment"># 演示用精简词典；论文实际采用吴非等（2021）的完整数字化转型词库</span>
KEYWORDS = [<span class="hljs-string">&quot;人工智能&quot;</span>, <span class="hljs-string">&quot;区块链&quot;</span>, <span class="hljs-string">&quot;云计算&quot;</span>, <span class="hljs-string">&quot;大数据&quot;</span>,
            <span class="hljs-string">&quot;数字化转型&quot;</span>, <span class="hljs-string">&quot;智能制造&quot;</span>, <span class="hljs-string">&quot;物联网&quot;</span>, <span class="hljs-string">&quot;工业互联网&quot;</span>]

<span class="hljs-keyword">def</span> <span class="hljs-title function_">count_freq</span>(<span class="hljs-params">text: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">int</span>:
    <span class="hljs-string">&quot;&quot;&quot;统计单份年报中数字化转型关键词的总词频&quot;&quot;&quot;</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">sum</span>(w <span class="hljs-keyword">in</span> KEYWORDS <span class="hljs-keyword">for</span> w <span class="hljs-keyword">in</span> jieba.lcut(text))

raw = pd.read_csv(<span class="hljs-string">&quot;annual_reports.csv&quot;</span>)        <span class="hljs-comment"># 列：firm, year, text</span>
raw = raw.drop_duplicates([<span class="hljs-string">&quot;firm&quot;</span>, <span class="hljs-string">&quot;year&quot;</span>])    <span class="hljs-comment"># 防止 pivot 报错</span>
raw[<span class="hljs-string">&quot;freq&quot;</span>] = raw[<span class="hljs-string">&quot;text&quot;</span>].<span class="hljs-built_in">map</span>(count_freq)

<span class="hljs-comment"># 滚动算法：本年 + 前后各 1 年取算术平均，再做对数化</span>
panel = raw.pivot(index=<span class="hljs-string">&quot;firm&quot;</span>, columns=<span class="hljs-string">&quot;year&quot;</span>, values=<span class="hljs-string">&quot;freq&quot;</span>)
<span class="hljs-comment"># 注意 axis=1：年份在列方向，必须按年份平移，否则会错位成&quot;前后一家企业&quot;</span>
roll  = (panel.shift(<span class="hljs-number">1</span>, axis=<span class="hljs-number">1</span>) + panel + panel.shift(-<span class="hljs-number">1</span>, axis=<span class="hljs-number">1</span>)) / <span class="hljs-number">3</span>
DCG   = np.log1p(roll.stack()).rename(<span class="hljs-string">&quot;DCG&quot;</span>).reset_index()
</code></pre>
<blockquote>
<p>论文第 187 页：词频对数化并采用滚动算法，降低年报文本披露的异常偏差；首尾年份因缺前后一年会被丢弃</p>
</blockquote>

<h1 id="%E4%BB%A3%E7%A0%81%E7%A4%BA%E4%BE%8B%E4%BA%8C%E5%A4%8D%E7%8E%B0%E5%8F%8C%E5%90%91%E5%9B%BA%E5%AE%9A%E6%95%88%E5%BA%94%E5%9B%9E%E5%BD%92">代码示例二：复现双向固定效应回归</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> pandas <span class="hljs-keyword">as</span> pd
<span class="hljs-keyword">from</span> linearmodels.panel <span class="hljs-keyword">import</span> PanelOLS

df = pd.read_csv(<span class="hljs-string">&quot;panel.csv&quot;</span>)                  <span class="hljs-comment"># firm, year, DCG, Fintech, 控制变量</span>
df = df.sort_values([<span class="hljs-string">&quot;firm&quot;</span>, <span class="hljs-string">&quot;year&quot;</span>])          <span class="hljs-comment"># 必须先排序，否则 shift 取到上一行而非上一年</span>
df[<span class="hljs-string">&quot;Fintech_L1&quot;</span>] = df.groupby(<span class="hljs-string">&quot;firm&quot;</span>)[<span class="hljs-string">&quot;Fintech&quot;</span>].shift(<span class="hljs-number">1</span>)   <span class="hljs-comment"># 滞后一期</span>
df = df.set_index([<span class="hljs-string">&quot;firm&quot;</span>, <span class="hljs-string">&quot;year&quot;</span>])

<span class="hljs-comment"># 双向固定效应：entity_effects 控制企业，time_effects 控制年份</span>
model = PanelOLS.from_formula(
    <span class="hljs-string">&quot;DCG ~ Fintech_L1 + Asset + Lev + Conce + Age + Turnover + &quot;</span>
    <span class="hljs-string">&quot;Dual + Audit + Allocation + Roe + QFII + GDP + Struc23 + Digital_economy &quot;</span>
    <span class="hljs-string">&quot;+ EntityEffects + TimeEffects&quot;</span>,
    data=df,
)
res = model.fit(cov_type=<span class="hljs-string">&quot;clustered&quot;</span>, cluster_entity=<span class="hljs-literal">True</span>)   <span class="hljs-comment"># 企业层面聚类稳健标准误</span>
<span class="hljs-built_in">print</span>(res.summary)
</code></pre>

<h1 id="%E7%A0%94%E7%A9%B6%E7%BB%93%E8%AE%BA">研究结论</h1>
<p><strong>① 主效应</strong> 金融科技显著赋能企业数字化转型，经多重稳健性检验依然成立</p>
<p><strong>② 异质性</strong> 有利于非国有、高科技、成长期与成熟期企业，弥补传统金融错配</p>
<p><strong>③ 机制</strong> 通过缓解信息不对称、拓展财务资源、平滑风险三条渠道实现</p>
